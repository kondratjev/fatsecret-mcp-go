name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you call, and what did the server return (paste the tool result text)?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Tool name + arguments, e.g. search_foods {"search_expression":"apple"}.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Binary version or git commit hash.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, Streamable HTTP (Docker)]
      default: 0
